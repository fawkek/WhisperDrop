name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Show selected toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Run tests
        run: swift test

      - name: Build and verify app archive
        run: |
          ./script/build_and_run.sh --package
          codesign --verify --deep --strict --verbose=2 dist/WhisperDrop.app
          test -s dist/WhisperDrop.app/Contents/MacOS/mlx.metallib
          shasum -a 256 dist/WhisperDrop-*-macOS.zip

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: WhisperDrop-macOS-${{ github.sha }}
          path: dist/WhisperDrop-*-macOS.zip
          if-no-files-found: error
